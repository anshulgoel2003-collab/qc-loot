name: 30-Min QC Loot Tracker

on:
  schedule:
    - cron: '*/30 * * * *' # Runs automatically every 30 minutes, 24/7
  workflow_dispatch: # Allows you to run it manually anytime with a single tap

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/tools/python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run Loot Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.8883600849:AAHYq4WPcKEIIBvSiNXwdacw-PgVP7I6paU }}
          TELEGRAM_CHAT_ID: ${{ secrets.loot }}
        run: python multi_platform_loot_finder.py
